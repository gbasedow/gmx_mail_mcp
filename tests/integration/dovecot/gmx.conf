# GMX-like test server (capabilities and special folders as measured against GMX in M0,
# docs/probe-2026-11-20-v4.json). Test use only; mounted as /etc/dovecot/conf.d/gmx.conf.

protocols = imap submission

# IPv4 only: some CI/container hosts have no IPv6.
listen = *

# Only TLS for logins, like GMX (implicit TLS on 31993, STARTTLS on 31143/31587).
auth_allow_cleartext = no

# Advertised capabilities replaced by the GMX list: no CONDSTORE/QRESYNC, QUOTA, ESEARCH, UTF8=ACCEPT, COMPRESS.
imap_capability = IMAP4rev1 APPENDLIMIT=29360128 CHILDREN ENABLE ID IDLE LIST-EXTENDED LIST-STATUS LITERAL- MOVE NAMESPACE SASL-IR SORT SPECIAL-USE THREAD=ORDEREDSUBJECT UIDPLUS UNSELECT WITHIN

namespace inbox {
  mailbox Gesendet {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Entwürfe {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Gelöscht {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Spamverdacht {
    special_use = \Junk
    auto = subscribe
  }
}

# Submission (SMTP, STARTTLS with the test CA, like GMX on 587) relays accepted mail to the GreenMail container,
# which stores it for any recipient - so sending can be tested end to end. Never a real mail server.
submission_relay_host = greenmail
submission_relay_port = 3025
