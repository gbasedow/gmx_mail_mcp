name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # Manifest version, newest CHANGELOG entry and (on a tag) the tag must agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Version check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/check_version.py --tag "$TAG"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action refuses private repositories ("can only validate public repositories").
    # The job is skipped while the repository is private; it runs again once it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not (yet) registered in home-assistant/brands.
          ignore: brands
